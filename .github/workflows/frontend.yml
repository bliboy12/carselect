name: Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/frontend-autoselect

      - name: Build frontend
        run: npm run build
        working-directory: frontend/frontend-autoselect

      - name: Deploy to Azure Blob Storage
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch \
              --account-name ${{ secrets.STORAGE_ACCOUNT_NAME }} \
              --account-key ${{ secrets.STORAGE_ACCOUNT_KEY }} \
              --source frontend/frontend-autoselect/dist \
              --destination '$web' \
              --overwrite
