name: Backend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Install dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish API
        run: dotnet publish backend/CarSelect.API/CarSelect.API.csproj -c Release -o ${{ github.workspace }}/publish/api

      - name: Publish Identity
        run: dotnet publish backend/CarSelect.Identity/CarSelect.Identity.csproj -c Release -o ${{ github.workspace }}/publish/identity

      - name: Publish Reviews API
        run: dotnet publish backend/CarSelect.Reviews.API/CarSelect.Reviews.API.csproj -c Release -o ${{ github.workspace }}/publish/reviews

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: "carselect-api"
          publish-profile: ${{ secrets.API_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish/api

      - name: Deploy Identity
        uses: azure/webapps-deploy@v3
        with:
          app-name: "carselect-identityServer"
          publish-profile: ${{ secrets.IDENTITY_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish/identity

      - name: Deploy Reviews API
        uses: azure/webapps-deploy@v3
        with:
          app-name: "carselect-reviews-api"
          publish-profile: ${{ secrets.REVIEWS_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish/reviews
